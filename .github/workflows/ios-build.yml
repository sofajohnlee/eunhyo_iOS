name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Sync Android Hari assets
        run: bash scripts/sync_android_assets.sh
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project eunhyo_iOS.xcodeproj \
            -scheme eunhyo_iOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
